; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; I2C sensor libraries for the Vistra Kiosk
;   VL53L1X  -> 0x29  (height / distance)
;   MAX30102 -> 0x57  (heart rate)
;   MLX90614 -> 0x5A  (object temperature)
lib_deps =
    adafruit/Adafruit VL53L1X
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    bogde/HX711

; ---- Unit test environment (host - runs tests on this PC) ----
[env:host_test]
platform = native
test_framework = unity
build_flags = -Wl,-subsystem,console

; ---- Unit test environment (AVR - compiles for Mega 2560, uploads to hardware) ----
[env:megaatmega2560_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
test_framework = unity
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit VL53L1X
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    bogde/HX711
